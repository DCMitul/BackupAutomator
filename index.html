<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/gui/purecss/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/gui/purecss/build/grids-min.css">
    <link rel="stylesheet" href="/gui/purecss/build/grids-responsive-min.css">
    <link rel="stylesheet" href="/gui/frontend/main.css">
    <title>BackupAutomator - Web GUI</title>
</head>
<body>
	<div class="pure-g">
        <div class="topbar">
            <div class="pure-u-md-1-3"></div>
            <div class="pure-u-1-3">
                <p class="name">BackupAutomator</p>
            </div>
            <div class="pure-u-1-12"></div>
            <div class="pure-u-1-6">
                <button class="create-button" id="create-button" type="button">
                    <img class="pure-img image" src="/gui/assets/Create button.png" alt="Create">
                </button>
            </div>
                <div class="pure-u-1-24">
                    <button class="settings-button" id="settings-button" type="button">
                        <img class="pure-img sett" src="/gui/assets/settings.png" alt="Settings">
                    </button>
                </div>
        </div>
    </div>
    <div class="pure-g subbar">
        <div class="pure-u-1-2">
            <div class="jobid">
                <span>Job Id #</span>
                <input type="text" id="job-id-search" inputmode="numeric">
            </div>
        </div>
        <div class="pure-u-1-3"></div>
        <div class="pure-u-1-6">
            <p class="total">
                Total Jobs: XXXX
            </p>
        </div>
    </div>
    <div class="jobs">
        <p class="nojob">
            No Backup Jobs Found.
        </p>
        
    </div>
    <div class="bottombar">
        <div class="pure-g">
            <div class="pure-u-1-3">
                <div class="ver">Version X.X</div>
            </div>
            <div class="pure-u-1-3">
                <div class="store">XX% of backup drive full</div>
            </div>
            <div class="pure-u-1-3">
                <div class="cred">By DCMitul</div>
            </div>
        </div>
    </div>

<!-- CREATE JOB OVERLAY STARTS FROM HERE -->
<div class="create-overlay" id="create-overlay">

    <div class="create-panel">

        <h1>Create Job</h1>

        <div class="create-separator"></div>

        <div class="create-item">

            <img
                src="/gui/assets/Folder Icon.svg"
                alt=""
                class="create-icon"
            >

            <div class="create-content">

                <h2>Source</h2>

                <div class="create-control">

                    <input
                        type="text"
                        id="create-source"
                        placeholder="Select source"
                        readonly
                    >

                    <button
                        type="button"
                        class="browse-path"
                        data-mode="source"
                        data-target="#create-source"
                    >
                        Browse
                    </button>

                </div>

            </div>

        </div>

        <div class="create-item">

            <img
                src="/gui/assets/Folder Icon.svg"
                alt=""
                class="create-icon"
            >

            <div class="create-content">

                <h2>Destination</h2>

                <div class="create-control">

                    <input
                        type="text"
                        id="create-destination"
                        placeholder="Select destination"
                        readonly
                    >

                    <button
                        type="button"
                        class="browse-path"
                        data-mode="folder"
                        data-target="#create-destination"
                    >
                        Browse
                    </button>

                </div>

            </div>

        </div>

        <div class="create-item">

            <img
                src="/gui/assets/Clock icon.svg"
                alt=""
                class="create-icon"
            >

            <div class="create-content">

                <h2>Time Period</h2>

                <div class="create-control">

                    <input
                        type="number"
                        id="create-time"
                        min="1"
                        placeholder="Time"
                    >

                    <select id="create-time-unit">

                        <option value="m">Minutes</option>
                        <option value="h">Hours</option>
                        <option value="d">Days</option>
                        <option value="mm">Months</option>

                    </select>

                </div>

            </div>

        </div>


        <div class="create-item">
        
            <img
                src="/gui/assets/Exceptions icon.svg"
                alt=""
                class="create-icon"
            >
        
            <div class="create-content">
            
                <h2>Exceptions</h2>
            
                <div class="create-control">
                
                    <input
                        type="text"
                        id="create-exceptions"
                        placeholder="No files selected"
                        readonly
                    >
                
                    <button
                        type="button"
                        class="browse-path"
                        data-mode="files"
                        data-target="#create-exceptions"
                    >
                        Browse
                    </button>
                
                </div>
            
                <div
                    id="create-exceptions-list"
                    class="create-exceptions-list"
                ></div>
            
            </div>
        
        </div>

        <div class="create-item">

            <img
                src="/gui/assets/Exceptions icon.svg"
                alt=""
                class="create-icon"
            >

            <div class="create-content">

                <h2>Wildcard Exceptions</h2>

                <div class="create-control">

                    <input
                        type="text"
                        id="create-wildcards"
                        placeholder="Enter wildcard patterns"
                    >

                </div>

            </div>

        </div>

        <div class="create-item">

            <img
                src="/gui/assets/Archive icon.svg"
                alt=""
                class="create-icon"
            >

            <div class="create-content">

                <h2>Archiving</h2>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="create-zip"
                    >

                    <span class="slider"></span>

                </label>

            </div>

        </div>

        <div id="create-error" class="create-error"></div>
        <button
            type="button"
            id="create-job"
            class="create-action create-confirm"
        >
            Create Job
        </button>

        <button
            type="button"
            id="create-cancel"
            class="create-action create-cancel"
        >
            Cancel
        </button>

    </div>

</div>



<!-- SETTINGS OVERLAY STARTS FROM HERE -->
    <div class="settings-overlay" id="settings-overlay">

        <div class="settings-panel">

            <h1>Settings</h1>

            <div class="settings-separator"></div>

            <div class="setting-item">

                <img src="/gui/assets/Folder Icon.svg" alt="" class="setting-icon">

                <div class="setting-content">

                    <h2>Default Backup Folder</h2>

                    <div class="setting-control">
                        <input
                            type="text"
                            id="setting-backuploc"
                            placeholder="Default backup folder"
                            readonly
                        >

                        <button
                            type="button"
                            class="browse-folder"
                            data-target="#setting-backuploc"
                        >
                            Browse
                        </button>
                    </div>

                </div>

            </div>

            <div class="setting-item">

                <img
                    src="/gui/assets/Clock icon.svg"
                    alt=""
                    class="setting-icon"
                >

                <div class="setting-content">

                    <h2>Default Time Period</h2>

                    <div class="setting-control">

                        <input
                            type="number"
                            id="setting-time"
                            min="1"
                            placeholder="Time"
                        >

                        <select id="setting-time-unit">
                            <option value="m">Minutes</option>
                            <option value="h">Hours</option>
                            <option value="d">Days</option>
                            <option value="mm">Months</option>
                        </select>

                    </div>

                </div>

            </div>

            <div class="setting-item">

                <img
                    src="/gui/assets/Archive icon.svg"
                    alt=""
                    class="setting-icon"
                >

                <div class="setting-content">

                    <h2>Archiving by default?</h2>

                    <label class="switch">
                        <input type="checkbox" id="setting-zip">
                        <span class="slider"></span>
                    </label>

                </div>

            </div>

            <div class="setting-item">

                <img
                    src="/gui/assets/Logging icon.svg"
                    alt=""
                    class="setting-icon"
                >

                <div class="setting-content">

                    <h2>Logging?</h2>

                    <label class="switch">
                        <input type="checkbox" id="setting-logging">
                        <span class="slider"></span>
                    </label>

                </div>

            </div>
            
            <button
                type="button"
                id="settings-save"
                class="settings-action save-settings"
            >
                Save
            </button>


            <button
                type="button"
                id="autorun-toggle"
                class="settings-action autorun"
            >
                Start/Stop backup script autorun
            </button>


            <button
                type="button"
                id="delete-all"
                class="settings-action delete-all"
            >
                DELETE ALL JOBS
            </button>

        </div>

    </div>
    <div id="action-message"></div>
    <script src="/gui/frontend/main.js"></script>
</body>
</html>
