<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="purecss/build/base-min.css"> -->
	<link rel="stylesheet" href="gui/purecss/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="gui/purecss/build/grids-min.css">
    <link rel="stylesheet" href="gui/purecss/build/grids-responsive-min.css">
    <link rel="stylesheet" href="gui/main.css">
    <title>BackupAutomator - Web GUI</title>
</head>
<body>
	<div class="pure-g">
        <div class="topbar">
            <div class="pure-u-md-1-3"></div>
            <div class="pure-u-1-3">
                <p class="name">BackupAutomator</p>
            </div>
            <div class="pure-u-1-12"></div>
            <div class="pure-u-1-6">
                <img class="pure-img image" src="gui/assets/Create button.png" alt="Create Button">
            </div>
            <div class="pure-u-1-24">
                <img class="pure-img sett" src="gui/assets/settings.png" alt="Settings icon">
            </div>
        </div>
    </div>
    <div class="pure-g subbar">
        <div class="pure-u-1-2">
            <p class="jobid">
                Job Id #
            </p>
        </div>
        <div class="pure-u-1-3"></div>
        <div class="pure-u-1-6">
            <p class="total">
                Total Jobs: XXXX
            </p>
        </div>
    </div>
    <div class="jobs">
        <p class="nojob">
            No Backup Jobs Found.
        </p>
    </div>
    <div class="bottombar">
        <div class="pure-g">
            <div class="pure-u-1-3">
                <div class="ver">Version X.X</div>
            </div>
            <div class="pure-u-1-3">
                <div class="store">XX% of backup drive full</div>
            </div>
            <div class="pure-u-1-3">
                <div class="cred">By DCMitul</div>
            </div>
        </div>
    </div>

</body>
</html>
